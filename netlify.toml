[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Bundles env vars into the function code at build time so they don't count
# against AWS Lambda's 4KB runtime env-var limit. This is what lets the large
# Google service-account key coexist with all the other secrets.
[[plugins]]
  package = "netlify-plugin-bundle-env"

# Friendly path for the GHL webhook
[[redirects]]
  from = "/api/ghl-webhook"
  to = "/.netlify/functions/ghl-webhook"
  status = 200

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/send-sms"
  to = "/.netlify/functions/send-sms"
  status = 200

[[redirects]]
  from = "/api/rc-inbound-sms"
  to = "/.netlify/functions/rc-inbound-sms"
  status = 200

[[redirects]]
  from = "/api/rc-subscribe"
  to = "/.netlify/functions/rc-subscribe"
  status = 200

[[redirects]]
  from = "/api/auto-runner"
  to = "/.netlify/functions/auto-runner"
  status = 200


