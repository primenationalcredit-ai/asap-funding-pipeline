[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Run the cadence every 3 minutes, all day. The function itself checks business
# hours (9am-5pm Mountain, weekdays) and returns immediately outside them, so the
# off-hours runs are cheap no-ops. This replaces the external cron that used to
# poke it every 30 minutes, which is why things needed nudging by hand.
[functions."auto-runner"]
  schedule = "*/3 * * * *"


# Friendly path for the GHL webhook
[[redirects]]
  from = "/api/ghl-webhook"
  to = "/.netlify/functions/ghl-webhook"
  status = 200

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/send-sms"
  to = "/.netlify/functions/send-sms"
  status = 200

[[redirects]]
  from = "/api/rc-inbound-sms"
  to = "/.netlify/functions/rc-inbound-sms"
  status = 200

[[redirects]]
  from = "/api/rc-subscribe"
  to = "/.netlify/functions/rc-subscribe"
  status = 200

[[redirects]]
  from = "/api/auto-runner"
  to = "/.netlify/functions/auto-runner"
  status = 200


