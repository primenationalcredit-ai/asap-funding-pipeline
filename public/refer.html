<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Refer a client — ASAP Funding USA</title>
<style>
  :root { --navy:#002d61; --orange:#fe7402; --slate:#3d4a5c; --light:#f2f5f9; }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--slate)}
  .bar{background:var(--navy);padding:18px 20px;border-bottom:5px solid var(--orange)}
  .bar h1{margin:0;color:#fff;font-size:20px}
  .bar span{color:var(--orange)}
  .wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .who{background:#eef4ff;border:1px solid #cfe0ff;border-radius:10px;padding:10px 12px;margin-bottom:18px;font-size:14px;color:var(--navy)}
  h2{margin:0 0 6px;color:var(--navy);font-size:19px}
  p.lead{margin:0 0 18px;font-size:14px;line-height:1.5}
  label{display:block;font-size:13px;font-weight:bold;color:var(--navy);margin:14px 0 5px}
  input,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;font-family:inherit}
  input:focus,textarea:focus{outline:none;border-color:var(--orange)}
  textarea{min-height:78px;resize:vertical}
  .req{color:#e11d48}
  button{margin-top:20px;width:100%;background:var(--orange);color:#fff;border:0;border-radius:8px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer}
  button:disabled{opacity:.55;cursor:not-allowed}
  .msg{margin-top:14px;padding:12px;border-radius:8px;font-size:14px;display:none}
  .ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
  .err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
  .foot{margin-top:18px;text-align:center;font-size:12px;color:#94a3b8;line-height:1.6}
</style>
</head>
<body>
  <div class="bar"><h1>ASAP <span>FUNDING</span></h1></div>
  <div class="wrap">
    <div class="card">
      <div class="who" id="who" style="display:none"></div>
      <h2>Refer a client</h2>
      <p class="lead">Send us their details and we will take it from here. We reach out quickly, and you will be credited for the referral.</p>

      <label>Client's full name <span class="req">*</span></label>
      <input id="name" autocomplete="name" placeholder="Jane Smith" />

      <label>Business name</label>
      <input id="business" placeholder="Smith Trucking LLC" />

      <label>Phone number</label>
      <input id="phone" inputmode="tel" autocomplete="tel" placeholder="(555) 123-4567" />

      <label>Email address</label>
      <input id="email" type="email" inputmode="email" placeholder="jane@smithtrucking.com" />

      <label>Anything we should know</label>
      <textarea id="notes" placeholder="What they are looking for, best time to reach them, anything helpful."></textarea>

      <button id="send">Send referral</button>
      <div class="msg ok" id="ok"></div>
      <div class="msg err" id="err"></div>

      <p class="foot">
        Phone or email is required so we can reach them.<br />
        ASAP Funding USA &middot; 15915 Katy Freeway, Suite 555, Houston, TX 77094
      </p>
    </div>
  </div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var ref = (params.get('ref') || '').trim();
  if (ref) {
    var pretty = ref.replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    var who = document.getElementById('who');
    who.textContent = 'Referred by ' + pretty;
    who.style.display = 'block';
  }

  var btn = document.getElementById('send');
  var ok = document.getElementById('ok');
  var err = document.getElementById('err');
  var val = function (id) { return (document.getElementById(id).value || '').trim(); };

  btn.addEventListener('click', async function () {
    ok.style.display = 'none';
    err.style.display = 'none';

    if (!val('name')) { err.textContent = "Please enter the client's name."; err.style.display = 'block'; return; }
    if (!val('phone') && !val('email')) { err.textContent = 'Please add a phone number or an email address.'; err.style.display = 'block'; return; }

    btn.disabled = true;
    btn.textContent = 'Sending...';
    try {
      var res = await fetch('/.netlify/functions/submit-referral', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: val('name'), business: val('business'), phone: val('phone'),
          email: val('email'), notes: val('notes'), ref: ref
        })
      });
      var j = await res.json().catch(function () { return {}; });
      if (!res.ok || j.error) {
        err.textContent = j.error || 'Something went wrong. Please try again.';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Send referral';
        return;
      }
      ok.textContent = j.message || 'Thanks, we have got their details.';
      ok.style.display = 'block';
      ['name','business','phone','email','notes'].forEach(function (id) { document.getElementById(id).value = ''; });
      btn.textContent = 'Send another referral';
      btn.disabled = false;
    } catch (e) {
      err.textContent = 'Could not send. Check your connection and try again.';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Send referral';
    }
  });
})();
</script>
</body>
</html>
